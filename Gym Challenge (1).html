<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#c6ff3d;--dim:.55;--tx:#f4f4fa;--mu:#9a9ab0;--cd:rgba(16,16,26,.66);--bd:rgba(255,255,255,.09);--pk:#ff4da6;--cy:#36e1ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#07070c;color:var(--tx);font:15px/1.4 'Space Grotesk',system-ui,sans-serif;padding-bottom:96px}
#bg{position:fixed;inset:0;z-index:-1;background:#07070c center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:rgba(7,7,12,var(--dim))}
.w{max-width:560px;margin:0 auto;padding:18px 16px}
h1,h2,h3{font-family:Syne,'Space Grotesk',sans-serif;margin:0;letter-spacing:-.02em}
h1{font-size:30px;font-weight:800}h2{font-size:19px;margin:22px 0 10px}h3{font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sub{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-bottom:12px}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;font-family:Syne,sans-serif;font-weight:800;color:#0a0a10;flex:none;border:2px solid rgba(255,255,255,.15)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.pips{display:flex;gap:5px;margin-top:6px}.pips i{height:7px;flex:1;border-radius:9px;background:rgba(255,255,255,.1)}.pips i.on{background:var(--a);box-shadow:0 0 10px var(--a)}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}
.ok{background:var(--a);color:var(--ink,#0a0a10)}.bad{background:var(--pk);color:#fff}.wait{background:rgba(54,225,255,.18);color:var(--cy)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:11px 16px;background:var(--a);color:var(--ink,#0a0a10);cursor:pointer}
button.g{background:rgba(255,255,255,.09);color:var(--tx)}button.r{background:var(--pk);color:#fff}button.s{padding:7px 12px;font-size:13px;border-radius:11px}
button.on{outline:2px solid var(--a)}
input,textarea{font:inherit;width:100%;background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:11px 12px;margin:4px 0 10px}
label{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.hero{display:flex;align-items:center;gap:16px}.rn{font:800 28px Syne,sans-serif;fill:var(--tx)}.rl{font-size:11px;fill:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(10,10,16,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:4px}
nav button{background:none;color:var(--mu);padding:8px 12px;font-size:12px;flex:1;max-width:100px}nav button.on{color:var(--a);outline:0;background:rgba(255,255,255,.07)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.show{display:flex}#modal>div{background:#12121c;border:1px solid var(--bd);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}.sw b{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer}.sw b.on{border-color:#fff}
.proof{width:56px;height:56px;border-radius:10px;object-fit:cover}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--a);color:#0a0a10;padding:10px 16px;border-radius:99px;font-weight:700;display:none;z-index:10}
.big{font:800 22px Syne,sans-serif}.crown{color:var(--a)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal i{display:block}.day{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;color:var(--mu)}.day.hit{color:#0a0a10;font-weight:700}.day.td{outline:1px solid var(--a)}
#ent{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(7,7,12,.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);text-align:center;overflow:auto}
#ent.show{display:flex;animation:fi .5s ease both}#ent.out{animation:eo .5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fi{from{opacity:0}}@keyframes eo{to{opacity:0;transform:scale(1.08)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}@keyframes pop{50%{transform:scale(1.5)}}@keyframes pop2{from{transform:scale(.6);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rg{from{stroke-dasharray:0 999}to{stroke-dasharray:var(--to) 999}}@keyframes pt{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);opacity:0}}
.et{font:800 30px Syne,'Space Grotesk',sans-serif;letter-spacing:-.02em;margin-bottom:6px}
.tiles{display:flex;gap:22px;overflow-x:auto;max-width:100%;padding:38px 26px;scroll-snap-type:x mandatory;align-items:flex-start}
.tile{background:none;border:0;color:var(--tx);padding:0;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:.5;transform:scale(.86);transition:transform .35s cubic-bezier(.2,1.2,.4,1),opacity .3s;animation:up .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*70ms);scroll-snap-align:center;cursor:pointer;flex:none}
.tile .av{transition:box-shadow .3s,border-color .3s}.tile.f{opacity:1;transform:scale(1.18)}.tile.f .av{border-color:var(--a);box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 34px var(--a)}
.tile span{font-weight:700;font-size:15px;opacity:0;transition:opacity .25s}.tile.f span{opacity:1}
.tiles.go .tile{opacity:0;transform:scale(.5);transition:.3s}.tiles.go .tile.sel{opacity:1;transform:scale(1.45)}
.bigav{animation:pop2 .55s cubic-bezier(.2,1.4,.4,1) backwards}#ph>*{animation:up .4s backwards}
.dots{display:flex;gap:16px;justify-content:center;margin:20px 0 26px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);transition:.2s}
.dots i.on{background:var(--a);border-color:var(--a);box-shadow:0 0 14px var(--a);animation:pop .25s}.dots.bad{animation:shake .45s}.dots.bad i{background:var(--pk);border-color:var(--pk);box-shadow:none}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}.pad button{width:76px;height:64px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--tx);font:700 24px 'Space Grotesk',sans-serif;padding:0;transition:transform .1s,background .2s}.pad button:active{transform:scale(.9);background:var(--a);color:var(--ink,#0a0a10)}
.okav{position:relative;width:176px;height:176px;display:grid;place-items:center}.okav svg{position:absolute}.dr{animation:draw .8s ease forwards}
.chk{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--a);color:var(--ink,#0a0a10);display:grid;place-items:center;font-weight:800;animation:pop2 .5s .6s cubic-bezier(.2,1.6,.4,1) backwards}
.pt{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:2px;background:var(--c);animation:pt .95s cubic-bezier(.1,.7,.3,1) forwards;pointer-events:none}
.ra{animation:rg 1s .15s cubic-bezier(.3,.7,.2,1) backwards}
#app.in>*{animation:up .55s cubic-bezier(.2,.8,.2,1) backwards}#app.in>:nth-child(2){animation-delay:.06s}#app.in>:nth-child(3){animation-delay:.12s}#app.in>:nth-child(4){animation-delay:.18s}#app.in>:nth-child(n+5){animation-delay:.24s}
#cel{position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;background:rgba(7,7,12,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center}#cel.show{display:flex;animation:fi .3s both}
.cb{animation:pop2 .5s cubic-bezier(.2,1.3,.4,1) backwards}.cr{position:relative;width:170px;height:170px;margin:auto}.cn{position:absolute;inset:0;display:grid;place-items:center;font:800 34px Syne,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

</style></head><body>
<div id="bg"></div><div class="w"><div id="app"></div></div>
<nav id="nav"></nav><div id="modal"></div><div id="toast"></div><div id="ent"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage full')}};
const NAMES=['members','sessions','votes','props','fdone','config','pcom'],S={};NAMES.forEach(n=>S[n]={});
const PRE=['radial-gradient(60% 50% at 15% 10%,#7b2cff66,transparent),radial-gradient(50% 50% at 90% 35%,#ff2d9a44,transparent),#0a0a12','radial-gradient(60% 50% at 80% 10%,#c6ff3d33,transparent),radial-gradient(60% 60% at 10% 90%,#00d4aa44,transparent),#08100c','radial-gradient(70% 50% at 50% 0%,#ff8a3d66,transparent),radial-gradient(60% 60% at 90% 90%,#ff2d6a55,transparent),#140a0c','radial-gradient(60% 50% at 10% 20%,#36e1ff44,transparent),radial-gradient(60% 60% at 90% 80%,#3d5bff55,transparent),#080a14','#07070c'];
const ACC=['#c6ff3d','#ff4da6','#36e1ff','#ff8a3d','#9b7bff'],COL=['#c6ff3d','#ff4da6','#36e1ff','#ff8a3d','#9b7bff','#ffd23d','#3dffb0','#ff6b6b'];
const FD=['100 push ups in one day','Post an embarrassing gym selfie','Pay £10 into the pot','Wear a silly outfit to the next session'];
let db=null,ADMIN=true,tab='home',T={},dirty=false,READY=false,ANI=true;S.me=LS('gc_me');
const z2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)},mon=s=>{const d=pd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)};
const today=ymd(new Date()),thisWk=mon(today),month=today.slice(0,7),fmt=s=>pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const CF=()=>S.config.main||{},TG=()=>+CF().target||4,FL=()=>CF().forfeits||FD;
const M=()=>Object.entries(S.members).map(([id,m])=>({id,...m})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const mem=id=>S.members[id]?{id,...S.members[id]}:null;
const valid=()=>Object.entries(S.sessions).map(([id,s])=>({id,...s})).filter(s=>s.status!='rejected');
const cnt=(id,w)=>valid().filter(s=>s.mid==id&&mon(s.date)==w).length;
function mWeeks(){let w=mon(month+'-01');if(w<month+'-01')w=addD(w,7);const a=[];while(w.startsWith(month)){a.push(w);w=addD(w,7)}return a}
function stats(id){const dw=mWeeks().filter(w=>addD(w,6)<today),miss=dw.filter(w=>cnt(id,w)<TG()).length;return{done:dw.length,miss,hit:dw.length-miss,tot:valid().filter(s=>s.mid==id&&s.date.startsWith(month)).length,elig:dw.length>0&&miss==0,lvl:Math.min(4,miss)}}
const av=(m,z=40)=>m&&m.photo?`<img class="av" style="width:${z}px;height:${z}px" src="${m.photo}" alt="">`:`<div class="av" style="width:${z}px;height:${z}px;background:${m&&m.color||'#555'};font-size:${z*.42}px">${esc(((m&&m.name)||'?')[0]).toUpperCase()}</div>`;
const shrink=(f,max,q)=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(i.src);r(c.toDataURL('image/jpeg',q))};i.onerror=()=>r('');i.src=URL.createObjectURL(f)});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
/* data layer */
async function put(n,id,d){if(db){try{await db.collection(n).doc(id).set(d)}catch(e){toast('Couldn’t save: no permission')}}else{S[n][id]=d;SV('gc_'+n,S[n]);render()}}
async function del(n,id){if(db){try{await db.collection(n).doc(id).delete()}catch(e){toast('Couldn’t delete')}}else{delete S[n][id];SV('gc_'+n,S[n]);render()}}
/* theme */
function apply(t){const r=document.documentElement.style,a=t.accent||ACC[0],h=a.replace('#',''),L=(parseInt(h.slice(0,2),16)*.299+parseInt(h.slice(2,4),16)*.587+parseInt(h.slice(4,6),16)*.114)/255;r.setProperty('--a',a);r.setProperty('--ink',L>.55?'#0a0a10':'#fff');r.setProperty('--dim',t.dim??.55);const w=t.wp||'p0';$('#bg').style.background=/^p\d$/.test(w)?PRE[+w[1]]:`url(${w}) center/cover no-repeat #07070c`}
const theme=()=>apply({...CF(),...(LS('gc_theme')||{})});
function openTheme(){T={...CF(),...(LS('gc_theme')||{})};modal(`<h2 style="margin-top:0">Make it yours</h2><label>Wallpaper</label><div class="sw">${PRE.map((p,i)=>`<b style="background:${p}" onclick="T.wp='p${i}';apply(T);openThemeRefresh()"></b>`).join('')}</div><input type="file" accept="image/*" onchange="pickWp(this)"><label>Accent colour</label><div class="sw">${ACC.map(c=>`<b style="background:${c}" onclick="T.accent='${c}';apply(T)"></b>`).join('')}</div><label>Or pick any colour</label><input type="color" value="${T.accent||ACC[0]}" oninput="T.accent=this.value;apply(T)" style="height:46px;padding:4px"><label>Wallpaper darkness</label><input type="range" min="0" max="90" value="${Math.round((T.dim??.55)*100)}" oninput="T.dim=this.value/100;apply(T)"><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="saveTheme(0)">Apply for me</button>${ADMIN?'<button class="g" onclick="saveTheme(1)">Apply for everyone</button>':''}<button class="g" onclick="theme();modal()">Cancel</button></div>`)}
const openThemeRefresh=()=>{};
async function pickWp(i){if(i.files[0]){T.wp=await shrink(i.files[0],1280,.62);apply(T)}}
async function saveTheme(all){if(all&&!UNL)return askPin(()=>saveTheme(1));if(all){await put('config','main',{...CF(),wp:T.wp,accent:T.accent,dim:T.dim});localStorage.removeItem('gc_theme')}else SV('gc_theme',{wp:T.wp,accent:T.accent,dim:T.dim});theme();modal();toast('Saved')}
/* modal */
function modal(h){const m=$('#modal');if(h){m.innerHTML='<div>'+h+'</div>';m.classList.add('show')}else{m.classList.remove('show');m.innerHTML=''}}
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal'){theme();modal()}});
/* members */
let ME={};
function editMember(id){const m=id?mem(id):{name:'',color:COL[M().length%COL.length]};ME={id,...m};modal(`<h2 style="margin-top:0">${id?'Edit profile':'New member'}</h2><div style="display:flex;align-items:center;gap:14px;margin-bottom:12px"><div id="mav">${av(ME,72)}</div><input type="file" accept="image/*" onchange="pickPhoto(this)" style="margin:0"></div><label>Name</label><input id="mn" value="${esc(m.name)}" maxlength="24"><label>Colour</label><div class="sw">${COL.map(c=>`<b data-c="${c}" style="background:${c}" class="${c==ME.color?'on':''}" onclick="ME.color='${c}';editMemberRefresh()"></b>`).join('')}</div><label>Or pick any colour</label><input type="color" value="${ME.color}" oninput="ME.color=this.value;editMemberRefresh()" style="height:44px;padding:4px"><div style="display:flex;gap:8px"><button onclick="saveMember()">Save</button>${id&&ADMIN?`<button class="r" onclick="delMember('${id}')">Delete</button><button class="g" onclick="resetPin('${id}')">Reset passcode</button>`:''}<button class="g" onclick="modal()">Close</button></div>`)}
function editMemberRefresh(){ME.name=$('#mn').value;document.querySelectorAll('#modal .sw b').forEach(b=>b.classList.toggle('on',b.dataset.c==ME.color));$('#mav').innerHTML=av(ME,72)}
async function pickPhoto(i){if(i.files[0]){ME.photo=await shrink(i.files[0],320,.75);ME.name=$('#mn').value;$('#mav').innerHTML=av(ME,72)}}
async function saveMember(){const n=$('#mn').value.trim();if(!n)return toast('Add a name');const id=ME.id||Math.random().toString(36).slice(2,8);await put('members',id,{...(S.members[id]||{}),name:n,color:ME.color,photo:ME.photo||''});modal();toast('Saved')}
async function delMember(id){if(confirm('Delete this member and their sessions?')){for(const[k,s]of Object.entries(S.sessions))if(s.mid==id)await del('sessions',k);await del('members',id);modal()}}
const setMe=id=>{S.me=id;SV('gc_me',id);render()};
/* actions */
async function logSession(){if(!S.me)return toast('Pick your profile first');const f=$('#lf').files[0],d=$('#ld').value||today,n=cnt(S.me,mon(d))+1;await put('sessions','s'+Date.now(),{mid:S.me,date:d,note:$('#ln').value,proof:f?await shrink(f,640,.6):'',status:'pending',type:LT,ts:Date.now()});$('#ln').value='';$('#lf').value='';celebrate(LT,n)}
const setSt=(id,st)=>put('sessions',id,{...S.sessions[id],status:st});
const vote=async(k,v)=>put('votes',month+'_'+S.me,{...(S.votes[month+'_'+S.me]||{}),[k]:v});
async function addProp(){const t=$('#pt').value.trim();if(t&&S.me){await put('props','p'+Date.now(),{text:t,by:S.me,voters:[S.me]});$('#pt').value=''}}
const togProp=id=>{if(!S.me)return toast('Pick your profile first');const p=S.props[id],v=p.voters||[];put('props',id,{...p,voters:v.includes(S.me)?v.filter(x=>x!=S.me):[...v,S.me]})};
async function saveRules(){await put('config','main',{...CF(),target:+$('#tg').value||4,title:$('#tt').value||'Gym Challenge',forfeits:[0,1,2,3].map(i=>$('#f'+i).value||FD[i])});toast('Rules saved')}
const fdKey=id=>month+'_'+id,fdone=id=>S.fdone[fdKey(id)]&&S.fdone[fdKey(id)].n||0;
const markFd=id=>put('fdone',fdKey(id),{n:fdone(id)+1});
const proofView=id=>modal(`<img src="${S.sessions[id].proof}" style="width:100%;border-radius:14px"><br><br><button class="g" onclick="modal()">Close</button>`);
function summary(){const L=['🏋️ *Gym Challenge: week of '+fmt(thisWk)+'*','',...M().map(m=>{const c=cnt(m.id,thisWk);return(c>=TG()?'✅ ':'⏳ ')+m.name+' '+c+'/'+TG()}),'',...M().filter(m=>stats(m.id).lvl).map(m=>'⚠️ '+m.name+': Level '+stats(m.id).lvl+' forfeit ('+FL()[stats(m.id).lvl-1]+')')];return L.join('\n')}
const copySum=()=>{const t=$('#sm');t.select();try{navigator.clipboard.writeText(t.value);toast('Copied')}catch(e){document.execCommand('copy');toast('Copied')}};
let UNL=false;
function go(t){if(t=='admin'&&!UNL)return askPin();tab=t;ANI=true;render();scrollTo(0,0)}
let PC=null;function askPin(cb){PC=cb||null;modal(`<h2 style="margin-top:0">Admin passcode</h2><label>Enter 4 digits</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" oninput="if(this.value.length==4)checkPin(this.value)" style="font-size:28px;letter-spacing:.5em;text-align:center"><button class="g" onclick="theme();modal()">Cancel</button>`);setTimeout(()=>{const p=$('#pin');p&&p.focus()},50)}
function checkPin(v){if(v==='2002'){UNL=true;modal();if(PC){const f=PC;PC=null;f()}else{tab='admin';render();scrollTo(0,0)}}else{toast('Wrong passcode');$('#pin').value=''}}
/* entry screen */
const H=async(id,p)=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('gc:'+id+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa('gc:'+id+':'+p)}};
let ENT={step:'pick',id:null,mode:'',buf:'',first:'',f:0,busy:false,sig:''};
const entReset=()=>{ENT={step:'pick',id:null,mode:'',buf:'',first:'',f:0,busy:false,sig:''}};
