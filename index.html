const today=()=>S?.today||B?.today||new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

function demoSeed(){const t=localToday(),w=monday(t),m=w.slice(0,7),mk=(id,n)=>Array.from({length:n},(_,i)=>({id:`demo-${id}-${i}`,profileId:id,day:addDays(w,i),week:w,kind:['push','pull','legs'][i%3],note:'Sample workout',status:'approved',createdAt:ts()-i*9000,hasProof:false}));return {today:t,auth:null,profiles:[{id:'you',name:'Your profile',avatar:'',claimed:true,isAdmin:true,pin:'1234'},{id:'alex',name:'Alex',avatar:'',claimed:true,isAdmin:false,pin:'1234'},{id:'priya',name:'Priya',avatar:'',claimed:true,isAdmin:false,pin:'1234'},{id:'sam',name:'Sam',avatar:'',claimed:true,isAdmin:false,pin:'1234'}],checkins:[...mk('alex',4),...mk('priya',3),...mk('sam',2)],rules:[],defaults:fallback,done:[],proposals:[],proposalVotes:[],mvpVotes:[],proofs:{}}}
let D=null;function saveD(){try{localStorage.setItem(previewKey,JSON.stringify(D))}catch{/* Some file:// browsers disallow local storage; demo remains in-memory */}};function initD(){try{D=JSON.parse(localStorage.getItem(previewKey))||demoSeed()}catch{D=demoSeed()}D.today=localToday();saveD()}
function demoReq(url,method,b){if(!D)initD();const clone=()=>JSON.parse(JSON.stringify(D));const prof=id=>D.profiles.find(p=>p.id===id);if(url==='/api/bootstrap')return {setupRequired:false,profiles:D.profiles.map(({pin,...p})=>p),me:prof(D.auth)?((({pin,...p})=>p)(prof(D.auth))):null,today:D.today};if(url==='/api/login'){const p=prof(b.profileId);if(!p||p.pin!==b.pin)throw Error('Incorrect demo PIN (try 1234)');D.auth=p.id;saveD();return{ok:true}}if(url==='/api/claim'){const p=prof(b.profileId);if(!p||p.code!==b.claimCode)throw Error('Invalid invitation code');p.pin=b.pin;p.claimed=true;D.auth=p.id;saveD();return{ok:true}}if(url==='/api/logout'){D.auth=null;saveD();return{ok:true}}if(!D.auth)throw Error('Choose a profile');if(url==='/api/state'){const a=clone(),m=prof(D.auth);a.me=(({pin,...p})=>p)(m);a.profiles=a.profiles.map(({pin,code,...p})=>p);return a}if(url==='/api/checkins'&&method==='POST'){if(D.checkins.some(c=>c.profileId===D.auth&&c.day===D.today))throw Error('Already logged today. Come back tomorrow!');D.checkins.unshift({id:'demo-'+ts(),profileId:D.auth,day:D.today,week:monday(D.today),kind:b.kind,note:b.note,status:'pending',createdAt:ts(),hasProof:true});D.proofs[D.checkins[0].id]=b.proof;saveD();return{ok:true}}const proof=url.match(/^\/api\/checkins\/(.*?)\/proof$/);if(proof)return{proof:D.proofs[proof[1]]||''};const review=url.match(/^\/api\/checkins\/(.*?)\/review$/);if(review){const c=D.checkins.find(x=>x.id===review[1]);if(c)c.status=b.status}if(url==='/api/profiles'&&method==='POST'){const id='p'+ts(),code=Math.random().toString(36).slice(2,10).toUpperCase();D.profiles.push({id,name:b.name,avatar:b.avatar||'',claimed:false,isAdmin:false,pin:'',code});saveD();return{ok:true,inviteCode:code,profileId:id}}const edit=url.match(/^\/api\/profiles\/(.*?)$/);if(edit&&method==='PATCH'){const p=prof(edit[1]);p.name=b.name||p.name;if(b.avatar!==undefined)p.avatar=b.avatar}const reset=url.match(/^\/api\/profiles\/(.*?)\/reset$/);if(reset&&method==='POST'){const p=prof(reset[1]);p.pin='';p.claimed=false;p.code=Math.random().toString(36).slice(2,10).toUpperCase();saveD();return{inviteCode:p.code}}if(url==='/api/rules'&&method==='POST'){D.rules=D.rules.filter(r=>r.month!==b.month).concat(b)}if(url==='/api/forfeit-completed'&&method==='POST'){const x=D.done.find(z=>z.profileId===b.profileId&&z.week===b.week);if(x)x.completed=x.completed?0:1;else D.done.push({month:b.week.slice(0,7),week:b.week,profileId:b.profileId,completed:1})}if(url==='/api/proposals'&&method==='POST'){D.proposals.push({id:'prop'+ts(),profileId:D.auth,createdAt:ts(),...b})}if(url==='/api/proposal-votes'&&method==='POST'){D.proposalVotes=D.proposalVotes.filter(x=>x.month!==nextMonth(activeMonth())||x.voterId!==D.auth);D.proposalVotes.push({month:nextMonth(activeMonth()),voterId:D.auth,proposalId:b.proposalId})}if(url==='/api/apply-proposal'&&method==='POST'){const p=D.proposals.find(x=>x.id===b.proposalId);D.rules=D.rules.filter(x=>x.month!==p.month).concat({month:p.month,target:4,forfeits:p.forfeits})}if(url==='/api/mvp-votes'&&method==='POST'){if(D.mvpVotes.some(x=>x.month===b.month&&x.voterId===D.auth))throw Error('You have already voted');D.mvpVotes.push({month:b.month,voterId:D.auth,candidateId:b.candidateId,createdAt:ts()})}saveD();return{ok:true}}
async function api(url,method='GET',body){if(demoMode)return demoReq(url,method,body);const response=await fetch(url,{method,credentials:'same-origin',headers:method==='GET'?{}:{'content-type':'application/json'},body:method==='GET'?undefined:JSON.stringify(body||{})});let result;try{result=await response.json()}catch{throw Error(`Server returned ${response.status}`)}if(!response.ok)throw Error(result.error||'Request failed');return result}

s="label">This week's forfeit if you fall short</div><h3 class="section-title" style="margin-top:9px;color:var(--red-light)">${esc(rule(activeMonth()).forfeits[Math.max(0,mondays(activeMonth()).indexOf(w))]||rule(activeMonth()).forfeits[4])}</h3><p class="section-desc" style="margin:9px 0 0">The challenge increases each week, whether or not you previously missed a target.</p></div>${demoMode?'<div class="support-note" style="margin-top:14px">PREVIEW MODE · demo PIN is <b>1234</b>. Entries on this file are only saved on this device.</div>':''}`}

function crewPage(){const m=activeMonth(),w=activeWeek(),listed=profiles().map(p=>({...p,c:weekCount(p.id,w),hits:totalHits(p.id,m),all:countAll(p.id,m)})).sort((a,b)=>b.hits-a.hits||b.all-a.all);const monthWeeks=mondays(m).length;return `${top()}<div class="eyebrow">CONSISTENCY OVER EVERYTHING</div><h1 style="font-size:29px;letter-spacing:-.06em;margin:6px 0 6px">The leaderboard.</h1><p class="section-desc">Ranking rewards completed weeks first, then total logged workouts.</p><div class="card">${listed.map((p,i)=>`<div class="list-row"><div class="score-rank ${i<3?'top':''}">${n2(i+1)}</div>${avatar(p,'md')}<div class="grow"><div class="row-name">${esc(p.name)} ${p.id===me().id?'<span class="red">· you</span>':''}</div><div class="row-sub">${p.hits}/${monthWeeks} weeks completed · ${p.all} workouts</div><div class="progress-mini"><i style="--pct:${Math.round(p.c/target()*100)}%"></i></div></div>${pill(p.c,target())}</div>`).join('')}</div><div class="section-head"><h2 class="section-title">Monthly highlights</h2></div><div class="metric-grid"><div class="metric"><div class="label">Crew workouts</div><div class="value num">${listed.reduce((n,x)=>n+x.all,0)}</div></div><div class="metric"><div class="label">Perfect weeks</div><div class="value num">${listed.reduce((n,x)=>n+x.hits,0)}</div></div><div class="metric"><div class="label">MVPs eligible</div><div class="value em num">${listed.filter(x=>eligible(x.id,m)).length}</div></div></div><div class="section-head"><h2 class="section-title">Your calendar</h2></div>${calCard(me().id)}`}
function calCard(id){const month=calendarMonth||activeMonth(),[y,mo]=month.split('-').map(Number),days=new Date(Date.UTC(y,mo,0)).getUTCDate(),offset=(dayOf(`${month}-01`).getUTCDay()+6)%7,hits=new Set(S.checkins.filter(x=>x.profileId===id&&x.status!=='rejected').map(x=>x.day));return `<div class="card"><div class="card-head"><button class="icon-btn" data-act="cal" data-value="-1" aria-label="Previous month">${I('back',17)}</button><h3 class="section-title">${monthName(month)}</h3><button class="icon-btn" data-act="cal" data-value="1" aria-label="Next month">${I('arrow',17)}</button></div><div class="calendar">${['M','T','W','T','F','S','S'].map(x=>`<div class="cal-h">${x}</div>`).join('')}${'<div></div>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const d=`${month}-${n2(i+1)}`;return `<div class="cal-day ${hits.has(d)?'hit':''} ${d===today()?'today':''}" style="animation-delay:${Math.min(i,21)*15}ms">${i+1}</div>`}).join('')}</div></div>`}
function forfeitsPage(){const m=forfeitView||activeMonth(),weeks=mondays(m),r=rule(m),owe=profiles().flatMap(p=>weeks.filter(w=>isDoneWeek(w,today())&&!weekHit(p.id,w)&&!forfeitDone(p.id,w)).map(w=>({p,w,index:weeks.indexOf(w)}))),current=activeWeek();return `${top()}<div class="eyebrow">THE CONSEQUENCES OF SKIPPING</div><h1 style="font-size:29px;letter-spacing:-.06em;margin:6px 0 6px">The forfeit ladder.</h1><p class="section-desc">Every missed week triggers that week's fitness forfeit. Difficulty increases for the whole crew each week, not only repeat offenders.</p><div class="button-row" style="margin:0 0 18px"><button class="btn ghost small" data-act="forfeitMonth" data-value="${prevMonth(m)}">${I('back',15)} Previous</button><span class="pill">${monthName(m)}</span><button class="btn ghost small" data-act="forfeitMonth" data-value="${nextMonth(m)}">Next ${I('arrow',15)}</button></div><div class="ladder">${weeks.map((w,i)=>`<div class="forfeit-item ${w===current?'active':''}"><div class="step-num">${i+1}</div><div class="grow"><div class="label">Week ${i+1} · ${fmt(w)} – ${fmt(addDays(w,6))}</div><div class="step-text">${esc(r.forfeits[Math.min(i,4)])}</div><div class="micro" style="margin-top:7px">${w===current?'Current week':isDoneWeek(w,today())?'Week finished':'Upcoming'}</div></div></div>`).join('')}</div><div class="section-head"><h2 class="section-title">Outstanding forfeits</h2><span class="pill risk">${owe.length} due</span></div><div class="card">${owe.length?owe.map(x=>`<div class="list-row">${avatar(x.p,'md')}<div class="grow"><div class="row-name">${esc(x.p.name)} · Week ${x.index+1}</div><div class="row-sub">${esc(r.forfeits[Math.min(x.index,4)])}</div></div>${me().isAdmin?`<button class="btn ghost small" data-act="markForfeit" data-id="${x.p.id}" data-value="${x.w}">Mark done</button>`:'<span class="pill risk">Due</span>'}</div>`).join(''):'<p class="muted">No outstanding forfeits for this month. Respect.</p>'}</div><div class="support-note" style="margin-top:15px">Forfeits should be fitness-based but safe. Adjust or waive them for injury, illness or disability instead of forcing someone to train through pain.</div>`}
function votePage(){
 const current=activeMonth(), past=prevMonth(current), next=nextMonth(current);

 const proposals=S.proposals.filter(p=>p.month===next);

 }).join('');
 const proposalRows=proposals.map(p=>{

 }).join('');
 return `${top()}<div class="eyebrow">A LITTLE HEALTHY COMPETITION</div><h1 style="font-size:29px;letter-spacing:-.06em;margin:6px 0 6px">The voting room.</h1><p class="section-desc">A vote for the consistent. A vote for what comes next.</p><div class="card"><div class="card-head"><div><div class="eyebrow">THE CROWN</div><h2 class="section-title">Gym MVP · ${monthName(past)}</h2></div>${I('crown',29)}</div>${nomineeRows||'<div class="support-note">MVP voting opens once someone completes every week of the previous month. Only perfect-attendance members are nominated.</div>'}${mine?'<p class="micro" style="margin-top:12px">Thanks for voting. One MVP vote per member.</p>':''}</div><div class="section-head"><h2 class="section-title">Next month's fitness forfeits</h2><span class="pill">${monthName(next)}</span></div><div class="card"><div class="card-head"><div class="micro">Each proposal includes a complete five-week escalation plan.</div><button class="btn outline small" data-act="propose">${I('log',14)} Propose</button></div>${proposalRows||'<p class="muted">No forfeit ideas yet. Be the first to nominate a fitness challenge.</p>'}</div>`;
}

p class="muted">Nothing to review.</p>'}</div><div class="section-head"><h2 class="section-title">Monthly rules</h2></div><form class="card" data-form="rules"><label class="field">Challenge month</label><input type="month" class="input" name="month" value="${m}" required><label class="field">Workouts required per week</label><input class="input" type="number" name="target" min="1" max="7" value="${r.target}" required>${r.forfeits.map((f,i)=>`<label class="field">Week ${i+1} · fitness forfeit</label><input class="input" name="f${i}" maxlength="180" value="${esc(f)}" required>`).join('')}<button class="btn full" style="margin-top:17px">Save monthly rules</button></form><div class="section-head"><h2 class="section-title">WhatsApp update</h2></div><div class="card"><p class="section-desc">Ready-to-paste weekly summary. You can send it directly to your WhatsApp group.</p><textarea class="input" id="summaryText" rows="10" readonly>${esc(summaryText())}</textarea><div class="button-row"><button class="btn" data-act="copySummary">${I('check',16)} Copy summary</button><button class="btn ghost" data-act="shareSummary">Share</button></div></div>`}
function summaryText(){const w=activeWeek(),r=rule(w.slice(0,7)),n=r.target;return `🏋️ gymclo · Week of ${fmt(w)}\n\n${profiles().map(p=>`${weekCount(p.id,w)>=n?'✅':'⏳'} ${p.name}: ${weekCount(p.id,w)}/${n}`).join('\n')}\n\n🔥 This week's forfeit: ${r.forfeits[mondays(w.slice(0,7)).indexOf(w)]||r.forfeits[0]}\n\nLog your gym sessions: ${demoMode?'[add live link here]':location.origin}`}

async function imageFile(file,max=700,q=.74){if(!file)return '';if(!file.type.startsWith('image/'))throw Error('Please select an image');const blob=URL.createObjectURL(file);try{const im=new Image();im.src=blob;try{await im.decode()}catch{throw Error('This photo format cannot be opened. Try JPG, PNG or WebP (convert HEIC to JPG if necessary).')}const scale=Math.min(1,max/Math.max(im.width,im.height));const can=document.createElement('canvas');can.width=Math.max(1,Math.floor(im.width*scale));can.height=Math.max(1,Math.floor(im.height*scale));can.getContext('2d').drawImage(im,0,0,can.width,can.height);const out=can.toDataURL('image/jpeg',q);if(out.length>600000)throw Error('Image too large. Try a smaller one.');return out}finally{URL.revokeObjectURL(blob)}}

function modalWallpaper(){const t=setWallpaper();openModal({title:'Make gymclo yours',body:`<p class="section-desc">Wallpapers are personal to your device; they don't change your friends' experience.</p><div class="label">Choose an atmosphere</div><div class="wall-presets">${['ember','oxide','slate','noir'].map(x=>`<button class="wall-option ${x} ${!t.photo&&t.theme===x?'active':''}" data-act="wallChoice" data-value="${x}" aria-label="${x} wallpaper"></button>`).join('')}</div><label class="field">Upload your own wallpaper</label><input class="input" id="wallInput" type="file" accept="image/*"><label class="field">Wallpaper darkness</label><input class="input" type="range" id="wallDim" min="0" max="0.7" step="0.05" value="${t.dim}"><div class="button-row"><button class="btn ghost" data-act="wallReset">Restore default</button><button class="btn" data-act="closeModal">Done</button></div>`})}
function modalMember(id){const p=profile(id)||{},isCreate=!id;openModal({title:isCreate?'Add a crew member':'Edit profile',body:`<form data-form="${isCreate?'addMember':'editMember'}" data-id="${esc(id||'')}"><div style="display:flex;gap:14px;align-items:center">${avatar(p,'lg')}<div class="grow"><label class="field" style="margin-top:0">Display name</label><input class="input" name="name" maxlength="28" value="${esc(p.name||'')}" required placeholder="Name"></div></div><label class="field">Profile picture</label><input class="input" type="file" name="avatar" accept="image/*"><div class="support-note" style="margin-top:8px">${isCreate?'After creating the member you will receive a private claim code to share with them. They choose their own four-digit PIN.':'The picture can be changed without affecting attendance or votes.'}</div><button class="btn full" style="margin-top:16px">${isCreate?'Add profile':'Save profile'}</button></form>${!isCreate&&p.id===me().id?`<button class="btn ghost full" style="margin-top:10px" data-act="logout">${I('logout',15)} Switch profile / sign out</button>`:''}`})}
function invitation(code){openModal({title:'Invitation created',body:`<p class="section-desc">Send this code privately to the member. It is shown only now; you can generate a new one in Admin.</p><div class="card soft" style="text-align:center;font-size:21px;font-weight:850;letter-spacing:.11em;overflow-wrap:anywhere" id="inviteCode">${esc(code)}</div><button class="btn full" data-act="copyInvite" data-value="${esc(code)}" style="margin-top:15px">Copy invitation code</button>`})}
function modalProposal(){const m=nextMonth(activeMonth());openModal({title:'Pitch a fitness forfeit',body:`<p class="section-desc">Create a full weekly progression for ${monthName(m)}. Keep the challenges sensible and increasingly demanding.</p><form data-form="proposal"><label class="field">Name your proposal</label><input class="input" name="title" maxlength="64" required placeholder="The endurance ladder">${fallback.map((f,i)=>`<label class="field">Week ${i+1} · ${i===0?'entry level':i===4?'most challenging':'build up'}</label><input class="input" name="f${i}" maxlength="180" required value="${esc(f)}">`).join('')}<button class="btn full" style="margin-top:17px">Submit for group vote</button></form>`})}
async function showProof(id){const result=await api(`/api/checkins/${id}/proof`);openModal({title:'Workout evidence',body:result.proof?`<img src="${esc(result.proof)}" alt="Submitted workout evidence" style="width:100%;max-height:65vh;object-fit:contain;border-radius:14px">`:'<p class="muted">No preview photo for this demo entry.</p>'})}
function celebrate(count,n){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){toast('Workout logged!');return}const C=489,offset=C*(1-Math.min(1,count/n));cel.hidden=false;cel.innerHTML=`<div class="celebrate-content"><div class="eyebrow">ANOTHER ONE IN THE BOOKS</div><div class="celebrate-ring"><svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="78"/><circle class="active" cx="100" cy="100" r="78" style="--offset:${offset}"/></svg><div class="celebrate-count num"><span id="animateCount">0</span>/${n}</div></div><div class="celebrate-heading">${count>=n?'Week conquered.':'Session secured.'}</div><div class="celebrate-copy">${count>=n?'You hit your weekly standard.':`${n-count} to go. Keep showing up.`}</div><svg class="trail" viewBox="0 0 240 52" aria-hidden="true"><path class="trail-path" d="M5 41 C40 41 42 12 76 29 S130 54 153 18 S200 14 235 3"/><circle cx="235" cy="3" r="4" fill="var(--red-light)"/></svg><button class="btn ghost small" data-act="closeCelebration" style="margin-top:17px">Back to dashboard</button></div>`;for(let i=0;i<24;i++){const a=i/24*Math.PI*2,dist=100+Math.random()*170,e=document.createElement('span');e.className='particle';e.style.setProperty('--dx',`${Math.cos(a)*dist}px`);e.style.setProperty('--dy',`${Math.sin(a)*dist}px`);e.style.setProperty('--r',`${Math.round(Math.random()*520)}deg`);e.style.setProperty('--delay',`${Math.random()*.23}s`);cel.append(e)}const counter=q('#animateCount'),start=performance.now();const anim=t=>{const p=Math.min(1,(t-start)/950);counter.textContent=Math.round(count*(1-Math.pow(1-p,3)));if(p<1&&counter.isConnected)requestAnimationFrame(anim)};requestAnimationFrame(anim);clearTimeout(celebrate.timer);celebrate.timer=setTimeout(()=>cel.hidden=true,2800)}
async function act(a,btn){const value=btn.dataset.value,id=btn.dataset.id;switch(a){case'nav':tab=value;window.scrollTo({top:0,behavior:'smooth'});render();break;case'wallpaper':modalWallpaper();break;case'wallChoice':saveWallpaper({theme:value,photo:''});qa('.wall-option').forEach(b=>b.classList.toggle('active',b.dataset.value===value));break;case'wallReset':saveWallpaper({theme:'ember',photo:'',dim:.18});modalWallpaper();break;case'closeModal':closeModal();break;case'closeCelebration':cel.hidden=true;break;case'kind':selectedWorkout=value;qa('.kind-chip').forEach(b=>b.classList.toggle('active',b.dataset.value===value));break;case'admin':tab='admin';render();break;case'profile':modalMember(me().id);break;case'chooseProfile':chooseProfile(id,btn.dataset.index);break;case'backToProfiles':pin={id:'',mode:'enter',buf:'',first:'',busy:false};renderEntry();break;case'pinDigit':await digit(value);break;case'logout':await api('/api/logout','POST');S=null;B=await api('/api/bootstrap');closeModal();renderEntry();break;case'cal':{let m=calendarMonth||activeMonth(),[y,mo]=m.split('-').map(Number);const d=new Date(Date.UTC(y,mo-1+Number(value),1));calendarMonth=`${d.getUTCFullYear()}-${n2(d.getUTCMonth()+1)}`;render();break}case'forfeitMonth':forfeitView=value;render();break;case'proof':await showProof(id);break;case'review':await api(`/api/checkins/${id}/review`,'POST',{status:value});await refresh();toast(`Submission ${value}`);break;case'markForfeit':await api('/api/forfeit-completed','POST',{profileId:id,week:value});await refresh();toast('Forfeit marked as completed');break;case'copySummary':await navigator.clipboard.writeText(q('#summaryText').value);toast('Copied for WhatsApp');break;case'shareSummary':{const text=q('#summaryText').value;const shareUrl='https://wa.me/?text='+encodeURIComponent(text);window.open(shareUrl,'_blank','noopener');break}case'addMember':modalMember();break;case'editMember':modalMember(id);break;case'copyInvite':await navigator.clipboard.writeText(value);toast('Invitation code copied');break;case'resetPin':if(!confirm('Reset this member’s PIN? Their existing login sessions will be signed out.'))return;{const response=await api(`/api/profiles/${id}/reset`,'POST');await refresh();invitation(response.inviteCode);break}case'propose':modalProposal();break;case'proposalVote':await api('/api/proposal-votes','POST',{proposalId:id});await refresh();toast('Your vote is recorded');break;case'applyProposal':if(!confirm('Use this entire fitness ladder as next month’s rules?'))return;await api('/api/apply-proposal','POST',{proposalId:id});await refresh();toast('Next month’s forfeits updated');break;case'mvp':if(!confirm('Cast your one MVP vote for this member?'))return;await api('/api/mvp-votes','POST',{month:value,candidateId:id});await refresh();toast('MVP vote submitted');break;case'reload':await boot();break}}
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-act]');if(!btn||btn.disabled)return;try{await act(btn.dataset.act,btn)}catch(err){toast(err.message)}});
document.addEventListener('keydown',e=>{if(entry.hidden||!pin.id||pin.mode==='claim')return;if(/^\d$/.test(e.key)){e.preventDefault();digit(e.key)}else if(e.key==='Backspace'){e.preventDefault();digit('⌫')}else if(e.key==='Escape'){pin.id='';renderEntry()}});
entry.addEventListener('keydown',e=>{if(pin.id)return;const tiles=qa('.profile-tile');if(!tiles.length)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){selection=Math.max(0,Math.min(tiles.length-1,selection+(e.key==='ArrowRight'?1:-1)));qa('.profile-tile').forEach((t,i)=>t.classList.toggle('active',i===selection));tiles[selection].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});e.preventDefault()}if(e.key==='Enter'&&e.target.closest('.profile-gallery')===null){tiles[selection]?.click()}});
entry.addEventListener('mouseover',e=>{const t=e.target.closest('.profile-tile');if(t){qa('.profile-tile').forEach(b=>b.classList.toggle('active',b===t))}});
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='wallDim')saveWallpaper({dim:+e.target.value})});
document.addEventListener('change',async e=>{if(e.target.id==='wallInput'&&e.target.files[0]){try{const photo=await imageFile(e.target.files[0],1100,.7);saveWallpaper({photo});toast('Wallpaper changed')}catch(err){toast(err.message)}}if(e.target.id==='checkinPhoto'&&e.target.files[0]){try{formPhoto=await imageFile(e.target.files[0],750,.62);const label=q('.file-box .row-name');if(label)label.textContent='Photo ready ✓';toast('Evidence ready to submit')}catch(err){formPhoto='';toast(err.message)}}if(e.target.name==='month'&&e.target.closest('[data-form="rules"]')){adminMonth=e.target.value;render()}});
document.addEventListener('submit',async e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();if(loading)return;loading=true;const submit=q('button[type=submit]',form);if(submit)submit.disabled=true;const b=Object.fromEntries(new FormData(form));try{switch(form.dataset.form){case'setup':await api('/api/setup','POST',{name:b.name,setupCode:b.setupCode,pin:b.pin});await boot();break;case'claimCode':pin.claimCode=b.code.trim().toUpperCase();pin.mode='create';pin.buf='';renderPin();break;case'checkin':if(!formPhoto)throw Error('Choose a proof photo before submitting');await api('/api/checkins','POST',{kind:selectedWorkout,note:b.workoutNote||q('#workoutNote')?.value||'',proof:formPhoto});formPhoto='';{const count=weekCount(me().id,activeWeek())+1;await refresh();celebrate(count,target());}break;case'addMember':{const avatarFile=form.querySelector('[name=avatar]').files[0],avatar=avatarFile?await imageFile(avatarFile,400,.7):'';const result=await api('/api/profiles','POST',{name:b.name,avatar});await refresh();invitation(result.inviteCode);break}case'editMember':{const avatarFile=form.querySelector('[name=avatar]').files[0],p=profile(form.dataset.id);await api(`/api/profiles/${form.dataset.id}`,'PATCH',{name:b.name,avatar:avatarFile?await imageFile(avatarFile,400,.7):p.avatar});await refresh();closeModal();toast('Profile updated');break}case'rules':await api('/api/rules','POST',{month:b.month,target:+b.target,forfeits:Array.from({length:5},(_,i)=>b['f'+i])});await refresh();toast('Monthly rules saved');break;case'proposal':await api('/api/proposals','POST',{month:nextMonth(activeMonth()),title:b.title,forfeits:Array.from({length:5},(_,i)=>b['f'+i])});await refresh();closeModal();toast('Proposal published for the crew');break}}catch(err){toast(err.message)}finally{loading=false;if(submit?.isConnected)submit.disabled=false}});
boot();

</script>
</body></html>
